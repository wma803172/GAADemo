<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04070b" />
<title>Intel 18A · 从一颗开关到一台电脑</title>
<meta name="description" content="沿着晶体管七十年的变形记，从平面到 FinFET，从 3nm 到 RibbonFET，再翻到芯片背面看 PowerVia 供电。" />
<link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./src/styles.css" />
<link rel="stylesheet" href="./src/ui/language.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 26V13.5L16 8l10 5.5V26"/><path d="M11 26V17l5-2.8 5 2.8v9"/><path d="M16 26v-5"/></svg>
      </span>
      <span class="brand-text"><b>Intel 18A</b><i>硅基之旅</i></span>
    </div>
    <div class="topbar-right">
      <div class="language-switch" role="group" aria-label="展示语言">
        <button type="button" data-lang="zh" lang="zh-CN" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
      </div>
      <span class="chapter-count" id="chapter-count">01 / 15</span>
      <button class="icon-btn" id="btn-quality" type="button" title="画质">高</button>
      <button class="icon-btn" id="btn-full" type="button" title="全屏">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M14 10v4h-4M2 10v4h4M14 6V2h-4"/></svg>
      </button>
    </div>
    <div class="progress-line"><i id="progress-fill"></i></div>
  </header>

  <main id="story" class="story"><!-- chapters injected --></main>

  <div class="hud-rail" id="rail" aria-hidden="true"></div>
  <div class="label-layer" id="labels" aria-hidden="true"></div>

  <aside id="flow-legend" class="flow-legend" aria-label="沟道光纹" hidden>
    <div class="flow-legend-row">
      <div class="flow-switch" role="group" aria-label="光纹显示方式">
        <button type="button" data-flow-mode="current" aria-pressed="true">常规电流</button>
        <button type="button" data-flow-mode="electrons" aria-pressed="false">电子</button>
      </div>
      <b id="flow-direction" aria-live="polite"></b>
    </div>
    <p id="flow-bias"></p>
    <p id="flow-history" hidden></p>
  </aside>

  <div class="scalebar" id="scalebar" aria-hidden="true">
    <div class="scalebar-track"><i id="scalebar-fill"></i></div>
    <span class="scalebar-label" id="scalebar-label">10 µm</span>
    <span class="scalebar-hint" id="scalebar-hint">非等比例</span>
  </div>

  <div class="hint" id="hint">
    <span class="hint-arrow" aria-hidden="true"></span>
    <span class="hint-text">向下滚动</span>
  </div>

  <div class="loader" id="loader">
    <div class="loader-inner">
      <span class="loader-kicker">INTEL 18A</span>
      <div class="loader-bar"><i></i></div>
      <span class="loader-text" id="loader-text">正在装载晶圆…</span>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
